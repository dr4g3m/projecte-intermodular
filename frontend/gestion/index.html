<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestió · Esquelet · La Massa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/gestion/gestion.js"></script>
</head>
<body>
  <h1>Gestió de reserves</h1><a href="/">Tornar</a>
  <!-- TODO F3: aquesta pàgina ENCARA NO té autenticació. Configurar-la a Nginx. -->
  <p id="admin-status" role="status">TODO F4: carregar les reserves.</p>
  <button id="refresh" type="button">Actualitzar</button>
  <table><thead><tr><th>ID</th><th>Nom</th><th>Data</th><th>Hora</th><th>Comensals</th><th>Estat</th><th>Accions</th></tr></thead>
    <tbody id="reservations"></tbody>
  </table>
  <h2>Editar reserva</h2>
  <form id="edit-form">
    <label>ID <input name="id" readonly required placeholder="Selecciona una fila"></label>
    <label>Nom <input name="name" required placeholder="Nom del client"></label>
    <label>Data <input name="date" type="date" required></label>
    <label>Hora <input name="time" type="time" required></label>
    <label>Comensals <input name="diners" type="number" min="1" max="8" required placeholder="1 - 8"></label>
    <button type="submit">Desar canvis</button>
  </form>
</body>
</html>
